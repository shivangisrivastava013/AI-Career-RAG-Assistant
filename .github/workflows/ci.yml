name: CI & Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Black Code Formatting Check
        run: |
          black --check .

      - name: Generate Sample Data & Index FAISS Corpus
        run: |
          python generate_jobs.py
          python generate_resumes.py
          python -m rag_assistant.index_jobs --input data/jobs --output artifacts --allow-fallback

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run Benchmark Evaluation Script
        run: |
          python evaluate.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t ai-career-rag-assistant:latest .
